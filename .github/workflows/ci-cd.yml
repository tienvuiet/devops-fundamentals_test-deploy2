name: CI/CD Spring Boot CNTT4 - Department - Employee

on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Kiểm tra source code
        uses: actions/checkout@v7

      - name: Cài đặt JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cấp quyền thực thi gradlew
        run: chmod +x gradlew

      - name: Chạy kiểm thử
        run: ./gradlew test

      - name: Đóng gói ứng dụng
        run: ./gradlew bootJar

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devops-fundamentals_test-deploy2:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-fundamentals_test-deploy2:latest
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          script: |
            mkdir -p ~/cntt4-backend-app
            cd ~/cntt4-backend-app
            if [ ! -d "devops-fundamentals_test-deploy2" ]; then
            git clone https://github.com/tienvuiet/devops-fundamentals_test-deploy2
            else
            cd cntt4-backend-employee
            git pull origin main
            fi
            
            cd ~/cntt4-backend-app/devops-fundamentals_test-deploy2
            
            docker compose pull backend-department
            
            docker compose up -d backend-department
            
            docker compose ps
          






